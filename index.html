<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFix — Smart Campus Issue Reporting Platform</title>
  
  <!-- Modern Typography (Inter Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Core & Component Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/modal.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF5B26'><circle cx='12' cy='12' r='10'/><path d='M12 8v8' stroke='white' stroke-width='2'/><path d='M8 12h8' stroke='white' stroke-width='2'/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Left Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand-logo" aria-label="CampusFix Home">
          <div class="brand-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 8-8"/><path d="m15 5 4 4"/><path d="m19 9-4 4"/><path d="m10 14 4-4"/><path d="m14 10-4 4"/><circle cx="17.5" cy="6.5" r="3.5"/></svg>
          </div>
          <div class="brand-text">Campus<span>Fix</span></div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Core Operations</div>
        
        <a href="#/dashboard" class="nav-link active" data-view="dashboard">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          </span>
          <span>Dashboard</span>
        </a>

        <a href="#/report" class="nav-link" data-view="report">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
          </span>
          <span>Report Issue</span>
          <span class="nav-badge-pill" style="color: var(--primary-orange); background: var(--primary-orange-light);">+ New</span>
        </a>

        <a href="#/kanban" class="nav-link" data-view="kanban">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v11"/><path d="M12 5v6"/><path d="M18 5v14"/></svg>
          </span>
          <span>My Reports</span>
        </a>

        <a href="#/resolved" class="nav-link" data-view="resolved">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
          </span>
          <span>Resolved Issues</span>
        </a>

        <div class="nav-section-title" style="margin-top: 14px;">Facility Intelligence</div>

        <a href="#/analytics" class="nav-link" data-view="analytics">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </span>
          <span>Analytics</span>
        </a>

        <a href="#/insights" class="nav-link" data-view="insights">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
          </span>
          <span>Smart Insights</span>
        </a>

        <a href="#/settings" class="nav-link" data-view="settings">
          <span class="nav-link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-profile">
          <div class="profile-avatar">AC</div>
          <div class="profile-info">
            <div class="profile-name">Alex Chen</div>
            <div class="profile-role">Facility Operations</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="app-main">
      <!-- Top Navigation & Search Bar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>

          <!-- Search Box -->
          <div class="global-search-container">
            <div class="global-search-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="global-search-input" placeholder="Search campus issues, locations, tickets or categories..." autocomplete="off">
              <span class="search-shortcut">/</span>
            </div>
            <div class="search-results-dropdown" id="global-search-results"></div>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Role Switcher Pill -->
          <div class="topbar-role-badge role-admin" id="topbar-role-badge" title="Click to toggle between Admin and Student role">
            <span class="badge-dot admin"></span>
            <span>Admin View</span>
          </div>

          <!-- Notification Bell -->
          <button class="btn-notif" id="notif-btn" aria-label="Notifications" title="Active campus notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="notif-badge" id="notif-badge-count">3</span>
          </button>

          <!-- Prominent + Report Issue Button -->
          <button class="btn btn-primary" id="topbar-report-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span>Report Issue</span>
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <section class="view-wrapper" id="view-container">
        <!-- Rendered dynamically by app.js -->
      </section>
    </main>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
